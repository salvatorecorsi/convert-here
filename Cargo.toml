[package]
name = "the-converter"
version = "0.7.1"
license = "GPL-3.0-only"
edition = "2024"
description = "Conversioni di audio, video, immagini e PDF, integrate in Windows"
repository = "https://github.com/salvatorecorsi/convert-here"
homepage = "https://github.com/salvatorecorsi/convert-here"
authors = ["Salvatore Corsi"]
build = "build.rs"
default-run = "the-converter"

[lib]
name = "the_converter"
path = "src/lib.rs"

[[bin]]
name = "the-converter"
path = "src/main.rs"

[dependencies]
anyhow = "1"
ab_glyph = "0.2.32"
clap = { version = "4.5", features = ["derive"] }
ctrlc = "3.4"
directories = "6"
fs2 = "0.4"
eframe = { version = "0.33.3", default-features = false, features = ["default_fonts", "glow"] }
image = { version = "0.25.9", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff", "ico", "qoi", "tga", "ff", "exr", "hdr", "pnm"] }
libwebp-sys = { version = "0.14.4", default-features = false }
lopdf = "0.38"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
which = "8"
url = "2"
time = { version = "0.3", features = ["formatting"] }
ttf-parser = "0.25.1"
unicode-normalization = "0.1.26"
unicode-segmentation = "1.13.3"
zip = { version = "6", default-features = false, features = ["deflate-flate2"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security", "Win32_Networking_WinHttp"] }

[target.'cfg(not(windows))'.dependencies]
open = "5"

[build-dependencies]
winresource = "0.1"

[profile.release]
lto = "thin"
strip = "symbols"
codegen-units = 1

