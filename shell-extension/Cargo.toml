[package]
name = "the-converter-shell"
version = "0.8.1"
license = "GPL-3.0-only"
edition = "2021"
publish = false
description = "Per-user Windows Explorer IExplorerCommand integration for Convert Here"
repository = "https://github.com/salvatorecorsi/convert-here"

[lib]
name = "the_converter_shell"
crate-type = ["cdylib"]

[dependencies]
serde_json = "1"

[dev-dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }

# This crate can be built on its own, outside the main application's workspace.
[workspace]

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"
